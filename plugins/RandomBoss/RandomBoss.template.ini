; ==========================================================================
; RandomBoss.template.ini —— 配置模板
; ==========================================================================
; 这个插件只做两件事：
;     1) 大地图换怪 —— 把指定的「源怪」换成「目标怪」
;     2) 紫皮（一難）—— 让目标怪带上强化
;
; 【怎么用】
;   把本文件复制到游戏目录，改名为 RandomBoss.ini：
;       <游戏目录>\plugins\RandomBoss.ini
;   例如 E:\SteamLibrary\steamapps\common\Nioh3\plugins\RandomBoss.ini
;
;   本模板的默认配置是：
;       ★ 把「朱の盆」和「獄卒鬼（焦熱）」全部换成「牛鬼 0xA263C」
;   想换成别的怪，只改 MapPool / MapSources 两行即可。
;
;   改完直接存盘 —— 插件会发现文件变了并自动热重载，不用重启游戏。
;
; 【怎么全关】
;   把 MapBoss / MapPurple / MapForceEmpower 都设成 0，插件就完全不碰游戏。
;
; 【注意】
;   代码里【没有任何内置名单】。所以如果 MapSources 或 MapPool 留空，
;   换怪就什么都不会发生（插件会在日志里打 WARNING 告诉你）。
; ==========================================================================

[RandomBoss]

; --- 基础 -----------------------------------------------------------------
; 要换成的目标怪。单只目标时用它，也是日志里 target=0x… 的显示值。
TargetId=0xA263C

; 永不被换的 ID。0x64 是通用战斗数据组件（每个实体的 HP 容器创建都走它），
; 被换掉会崩。除非你明确知道自己在做什么，否则别动这一行。
Blacklist=0x64

; ==========================================================================
; 一、大地图换怪
; ==========================================================================
; 原理（已用 CE 反汇编确认）：
;   引擎启动时会把全世界的「放置记录表」建好（每条 = 例项ID / 怪ID / 归属
;   flags），之后进任何区域都只是用 flags 筛选，不再重建（实测：区域切换时
;   对该字段下数据断点，一次都不触发）。
;   => 所以插件只在启动后扫一次这张表，把「源怪ID」改成「目标ID」，改完就收手。

; MapBoss=1 才启用换怪。关掉 = 插件完全不碰放置表（但仍可单独用紫皮）。
MapBoss=1

; MapHook=1 → 额外在「每次生成怪」时也改一次键（会在游戏代码里装一个
;   inline hook）。只靠 MapBoss 的一次性扫表已经能换掉大地图上的怪；
;   MapHook 是为了覆盖扫表之后才动态生成的怪。
MapHook=1

; 1 = 每个放置点固定一只（同一个点每次进去都一样）
; 2 = 每次进场重掷
MapRandomMode=1

; --- 目标池：要换成谁 -----------------------------------------------------
; ⚠️ 这一行是必须的。留空或删掉 = 没有任何目标 = 换怪完全不会发生。
;   格式：逗号分隔的 0x ID，可以写多个（写多个就是每次随机挑一个）。
;
; 0xA263C = 牛鬼 Gozuki。这是目前唯一在游戏里完整验证过的安全目标。
MapPool=0xA263C

; 想加目标：一次只加一个，进游戏确认没问题再加下一个。
; 0x782F6 = 马头鬼 Mezuki
;MapPool=0xA263C,0x782F6

; --- 源怪名单：哪些怪要被换掉 ---------------------------------------------
; ★ 这一行就是唯一来源。留空或删掉 = 没有任何源怪 = 换怪完全不会发生。
;   逗号分隔；顺序无关；支持 0x 前缀。
;
;   本模板默认的 26 项 = 獄卒鬼（焦熱）18 个变体 + 朱の盆 8 个变体
;   （ID 对照表随插件一起发布，本项目目录和 <游戏目录>\plugins\ 下各一份：
;      ids_hex_named.txt —— 689 条，格式「ID, 英文名, 中文名, 日文名」，按 ID 升序；
;                           想换的目标怪 ID 都在这里查
;      ids_by_name.txt   —— 按怪种分组、带变体数量（如 Jailer Oni x18），
;                           适合挑 MapSources 的源怪名单）
;
;   獄卒鬼（焦熱） Jailer Oni —— 18 个变体：
;     0x1361D 0x1A2E6 0x232D5 0x26C12 0x304FC 0x3CF7D 0x5D5B8 0x99943
;     0xA6DDA 0xB77A6 0xBC496 0xC0618 0xD0779 0xE1ABA 0xE6F42 0xE8E25
;     0xF2527 0xF3566
;   朱の盆 Shunobon —— 8 个变体：
;     0x300B8 0x53347 0x5E52D 0x60E01 0x97AD6 0xA697F 0xDF255 0xE0BB4
MapSources=0x1361D,0x1A2E6,0x232D5,0x26C12,0x304FC,0x3CF7D,0x5D5B8,0x99943,0xA6DDA,0xB77A6,0xBC496,0xC0618,0xD0779,0xE1ABA,0xE6F42,0xE8E25,0xF2527,0xF3566,0x300B8,0x53347,0x5E52D,0x60E01,0x97AD6,0xA697F,0xDF255,0xE0BB4

; --- 进阶：给某一只源怪单独指定池 -----------------------------------------
; 格式：MapPool_<源怪ID(16进制)>=<目标池>
;   没写 _ 后缀的源怪  -> 用上面的全局 MapPool
;   写了但【留空】      -> 这只怪保持原样，不换
;   写了多个目标        -> 在这几个里挑
;
; ⚠️ 什么情况【等于没写】：池和全局 MapPool 一模一样时 —— 选出来的目标完全
;    相同，行为毫无区别。
;    判据：这一行的池 ≠ 全局 MapPool，或者这一行的源不在 MapSources 里。
;
; 占槽规则（重要）：按【不同的源 key】计数，**不按行数**。
;   · 同一个源写 10 遍 = 1 个槽（最后一次生效）
;   · 空池（= 只写等号）也占 1 个槽
;   · 上限 256 个不同源；真写满时插件会打 WARNING 并告诉你忽略了几行
;
; ▼ 例子，全部已注释。要用就把对应行前面的 ; 去掉。
;
; (1) 只让朱の盆 0x53347 在牛鬼/马头鬼里随机，其他怪仍然只出全局池的牛鬼
;MapPool_53347=0xA263C,0x782F6
;
; (2) 让朱の盆 0x5E52D 保持原样不换（即使它在 MapSources 里）
;MapPool_5E52D=
;
; (3) 多只源怪共用一套随机池 —— 每只写一行，各占一个槽
;     獄卒鬼 4 个变体 -> 大天狗 / 镰鼬
;MapPool_BC496=0x41DB6,0xC76B4
;MapPool_E1ABA=0x41DB6,0xC76B4
;MapPool_232D5=0x41DB6,0xC76B4
;MapPool_1A2E6=0x41DB6,0xC76B4
;
; (4) 只想把某只怪【加进源名单】、池仍用全局的
;     即使 0x60E01 不在 MapSources 里，有这一行它也会被换
;MapPool_60E01=0xA263C

; ==========================================================================
; 二、紫皮（一難）
; ==========================================================================
; MapPurple=1 → 勾选"一难/紫皮"支持。两条路径都会装上：
;   1) 放置记录读取点钩子 (RVA 0x679895) —— 覆盖不全，是老的"部分工作"来源
;   2) ★ factory-REAL-entry 钩子 (RVA 0x5FC570) —— 实体创建/ensure 的必经
;      之路，RDX 即实体，**这是全覆盖的那条**
; 注意：entity+0xE8 的 bit 0x100 经实测**不是**外观判据（改了外观不变）。
MapPurple=1

; ==========================================================================
; ★★ MapForceEmpower=1 —— 唯一真正有效的那一刀
; ==========================================================================
; 【要解决的问题】
;   有些怪你打死过、之后重新刷出来就**永远是普通皮**，怎么改记录都不会变紫。
;
; 【机制】（CE 硬件"写"断点实测，RVA 0x54FB7D）
;   引擎在生成实体时会拿**放置记录的 instanceId** 去查一张"玩家已打死过"的表：
;
;     mov  edx,[rbx]            ; rbx = 放置记录，edx = record+0x00 instanceId
;     call <查表>               ; bool f(manager, instanceId)
;     test al,al
;     jne  +0x21                ; ★ al != 0 → 只写 entity+0xEA=1，
;                               ;            **跳过强化调用** → 普通皮
;     ...call <强化>...         ;   al == 0 → 走强化分支 → 紫皮
;
;   ⇒ 那只怪你**打死过**，所以永久被记在这张表里，**每次生成都被降级**。
;     这是游戏机制，不是插件 bug；也正因为判据是"记录 ID 查表"，插件此前
;     所有记录侧努力（改 flags / 族字节 / +0x58 / 补标 +0xE9）都不可能生效 ——
;     它们全在查表**之前**，而分流发生在查表**之后**。
;
; 【做法】把那 2 字节的 jne 改成 NOP（75 21 → 90 90），所有生成都走强化分支。
;   ✅ 实机验证：打完这 2 字节、快速传送重生一次，那只怪**当场变紫**。
;   ⚠️ 作用范围**不止目标怪**：所有经过这段生成代码的"已重生"怪都会走强化
;      分支。只想要牛鬼？那就别开这个开关（但那样那只怪永远普通）。
;   🛡️ 纯内存补丁：不改磁盘文件、不碰存档，**游戏一退出就自动恢复**。
;      特征码定位 + 写入前校验字节，游戏版本变了会打印日志并拒绝打补丁。
;   还原：把这一行改成 0 即可（下次启动就不再打）。
; ==========================================================================
MapForceEmpower=1

; FactoryDiag=1（诊断）→ 只装 factory-entry 钩子并采样：把前 N 个目标 key
;   实体在创建瞬间的字段快照写进日志（fep #n ent=... d38=.. d90=.. d94=..
;   dE8=..）。不改变任何行为，排查字段问题时才需要开。
FactoryDiag=0

; ==========================================================================
; MapRank（+0x58）—— ⚠️ **不是**紫皮开关，已证伪，保持 0
;
;   曾经以为它是开关，因为它在一组对照里分得开：
;       D06B  rank=500.0    实体 +0xE9 = 1
;       D39D  rank=1000.0   实体 +0xE9 = 0
;   但把它强制成 500（MapRank=1）后**那只怪仍然是普通** —— 相关不等于因果。
;
;   而且这个字段的实际取值远不止 500/1000，实测有 0 / 700 / 800 / 1000 /
;   1500 / 3000，强制成 500 等于**把所有牛鬼的强度标量都改了**（手册式误伤），
;   所以撤回默认值。
;
;   0 = 跟随放置点原值（默认，保持这个）
;   1 = 强制 500.0    2 = 强制 1000.0（只在你确实想改强度时才用）
; ==========================================================================
MapRank=0
MapRankEvery=1
